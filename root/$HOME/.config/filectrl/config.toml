# Programs to use to open files or directories, run with `sh -c`:
# %s stands for the relevant path, which the shell receives as an argument
# ("$@") rather than as part of the command. Write %s unquoted, as its own word.
[openers.linux]
open_directory = "alacritty --working-directory %s"
open_file = "xdg-open %s"
open_filectrl_window = "alacritty --command filectrl %s"
