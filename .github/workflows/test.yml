name: Test

# Every branch, not just main and pull requests: work lands on main directly as
# often as it arrives through one, so a check that only runs on main is a check
# that runs after the fact.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Keyed on the branch rather than the ref, so a re-push to one branch cancels
# its own earlier run and not another branch's. Keyed by the event as well: a
# cancelled run leaves its check runs on the head commit, and GitHub counts
# those against the required checks, so a push and its pull request cancelling
# each other would block the merge.
# Qualified by the repository the branch lives in, since a fork names its
# branches itself: two pull requests from different forks would otherwise share
# a group whenever they pick the same branch name.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    # Capped well under the six-hour default: nothing here runs longer than
    # six minutes, so a job still going at thirty has hung rather than failed.
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          # Nothing in this job uses the token, so it is not left
          # in .git/config for a later step to read.
          persist-credentials: false

      # -x follows a `source` into the file it names and -P SCRIPTDIR looks for
      # it beside the script doing the sourcing, which shellcheck cannot resolve
      # on its own. Set everywhere rather than only where something sources
      # today, so a script that starts to is already covered.
      #
      # node_modules is skipped because a Lint job that installs dependencies
      # would otherwise answer for shell a dependency ships.
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        env:
          SHELLCHECK_OPTS: -x -P SCRIPTDIR
        with:
          # Pinned rather than the action's `stable` default, which names a
          # moving release the action downloads at run time: without this a
          # ShellCheck release turns every one of these gates red on a commit
          # that did not touch them. Dependabot does not read an action input,
          # so this moves by hand.
          version: v0.11.0
          ignore_paths: node_modules
          scandir: "."
